# Publishes the ISS world's live cloud images to GitHub Pages every hour.
# This lives in its own small public repo (Pages has to be public, and *.github.io is on VRChat's trusted image
# list). The source of truth for the converter is tools/live_clouds.py in the nasa-3d-vr repo; copy it here when it
# changes; the same goes for events_feed.py (the observatory world's "Now" list, events.json). The site is the gh-pages branch, replaced on every run so it never grows. The push also counts as
# repository activity, which stops GitHub pausing the schedule after 60 quiet days.
name: clouds
on:
  schedule:
    - cron: "50 * * * *"   # NOAA posts each hour about 40 minutes after it ends
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clouds
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install h5py numpy pillow scipy
      - run: python live_clouds.py --fetch --out site
      # GFS forecast clouds and steering winds for the observatory (forecast.png, winds.png, forecast.json). Never
      # lets a forecast failure stop the clouds.
      - run: python forecast_layers.py --out site || true
      # Never lets a broken events source stop the clouds.
      - run: python events_feed.py --out site --clouds-dir site || true
      - name: Publish
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Clouds for $(cat time.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
